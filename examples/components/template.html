<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vera components</title>
<!--GENERATED-->
<style>
/* A proof sheet: each component pulled as a plate, its states side by side on a quiet stage. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0b0d0c);--ink:light-dark(#0b0b10,#eef2ef);--mute:light-dark(#5a5f66,#9aa39e);
  --line:light-dark(#e6e8ea,#1f2422);--stage:light-dark(#f6f7f8,#121614);--accent:#00a862;--mist:light-dark(#eafaf2,#0d1f16)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif;overflow-x:clip}
h1,h2{font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,5vw,44px)}h2{font-size:26px}
.band{padding:clamp(28px,4vw,56px) max(5vw,16px)}
.top{background:var(--mist);border-bottom:1px solid var(--line)}
.top p{max-width:68ch;margin:14px 0 0;color:var(--mute)}
nav{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px}
nav a{color:var(--ink)}
.plate{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(20px,4vw,48px);max-width:1240px;margin:0 auto;
  padding-block:clamp(28px,4vw,48px);border-bottom:1px solid var(--line)}
.plate .ask{margin:12px 0 0;color:var(--mute);font-size:15px}
.plate .pkg{display:block;margin-top:10px;font-size:13px;color:var(--mute)}
.stage{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.cell{background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;min-height:120px}
.cell .show{flex:1;display:flex;align-items:center;flex-wrap:wrap;gap:12px;font-size:17px}
.cell .say{font-size:13px;color:var(--mute)}
.cell h3{font:500 15px/1.3 system-ui,sans-serif;margin:0}
.reach{margin:14px 0 0;font-size:13px;color:var(--mute)}
.wide{grid-column:1/-1}
button.act{font:inherit;font-size:15px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
button.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
vera-field input,vera-field textarea{font:inherit;font-size:16px;min-height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
vera-field label{font-weight:500}
vera-field small{display:block;font-size:13px;color:var(--mute)}
vera-field [data-vera-part=error]{color:#c4321c}
svg.glyph{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:760px){.plate{grid-template-columns:minmax(0,1fr)}}
</style>
<!--IMPORTMAP-->
</head>
<body>
<header class="band top">
  <h1>Vera components</h1>
  <p>Every component in this repo, running its production bundle through an import map, in the states it ships with. Each plate comes from the package's own <code>src/&lt;name&gt;/demo.ts</code>, so this page is always the current source and build.</p>
</header>

<main class="band">
<!--PLATES-->
</main>

<script type="module">
{
  const { wire } = await import('@verajs/core');
  const { renderer } = await import('@verajs/renderer');
  const { lists } = await import('@verajs/renderer/keyed');
  const { slots } = await import('@verajs/renderer/slots');
  const { styles } = await import('@verajs/styles');
  wire([renderer, lists, slots, styles]);
  for (const name of /*COMPONENTS*/[]) await import('@vera-components/' + name);
  /**
   * A demo's form has nowhere to go: keep the page, let the component do its part. A form whose method is "dialog" is
   * let through: its submission is what closes its <dialog>, and it goes nowhere.
   */
  document.addEventListener('submit', (event) => {
    if (event.target.method !== 'dialog') event.preventDefault();
  });
}
</script>
</body>
</html>
