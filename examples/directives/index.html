<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VeraJS directives — every surface, live</title>

    <!--
      BUILDLESS, and deliberately on the PRODUCTION bundles: this page is also a live proof of
      substrate adoption. `@verajs/directives` bakes its own copy of core's store machinery, and
      core's `wire()` stamps the copy the app actually uses — so components and directives on
      this page share ONE store registry even though two copies of core were downloaded. That
      used to be the documented cross-bundle hazard; here it is the demo.

      To run the exact same page on CodePen, swap these for CDN URLs and change nothing else.
    -->
    <script type="importmap">
      {
        "imports": {
          "@verajs/core": "/packages/core/dist/vera.min.js",
          "@verajs/renderer": "/packages/renderer/dist/vera-renderer.min.js",
          "@verajs/router": "/packages/router/dist/vera-router.min.js",
          "@verajs/autoloader": "/packages/autoloader/dist/vera-autoloader.min.js",
          "@verajs/directives": "/packages/directives/dist/vera-directives.min.js"
        }
      }
    </script>

    <style>
      :root {
        --ink: #1a1a2e;
        --paper: #fdfcf8;
        --accent: #6246ea;
        --soft: #e6e2f5;
        --good: #0a7d4f;
        --bad: #b3273b;
        color-scheme: light dark;
      }
      html.night {
        --ink: #ece9f7;
        --paper: #16141f;
        --soft: #2a2540;
        --accent: #9b8bff;
      }
      html.has-modal main { filter: blur(2px); }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        line-height: 1.55;
        transition: background 0.3s, color 0.3s;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: color-mix(in srgb, var(--paper) 88%, transparent);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--soft);
        padding: 0.6rem 1rem;
      }
      header nav { display: flex; flex-wrap: wrap; gap: 0.15rem 0.6rem; max-width: 62rem; margin: 0 auto; }
      header a {
        color: var(--ink);
        text-decoration: none;
        padding: 0.2rem 0.55rem;
        border-radius: 0.5rem;
        font-size: 0.92rem;
      }
      header a[aria-current] { background: var(--accent); color: #fff; }
      main { max-width: 62rem; margin: 0 auto; padding: 1.2rem 1rem 6rem; }
      h1 { font-size: 1.6rem; }
      h2 { margin-top: 2.2rem; border-bottom: 2px solid var(--soft); padding-bottom: 0.3rem; }
      .lede { font-size: 1.05rem; max-width: 44rem; }

      demo-block { display: block; margin: 1.4rem 0; border: 1px solid var(--soft); border-radius: 0.75rem; overflow: hidden; }
      demo-block > .demo-live { padding: 1rem; }
      demo-block > .demo-caption {
        padding: 0.45rem 1rem; font-size: 0.9rem; background: var(--soft);
        display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      }
      demo-block details { border-top: 1px dashed var(--soft); }
      demo-block summary { cursor: pointer; padding: 0.4rem 1rem; font-size: 0.85rem; opacity: 0.75; }
      demo-block pre {
        margin: 0; padding: 0.8rem 1rem; overflow-x: auto; font-size: 0.82rem;
        background: color-mix(in srgb, var(--soft) 45%, var(--paper));
      }

      button, input, select {
        font: inherit; color: inherit; background: var(--paper);
        border: 1px solid var(--accent); border-radius: 0.5rem; padding: 0.3rem 0.7rem;
      }
      button { cursor: pointer; }
      button:hover:not(:disabled) { background: var(--soft); }
      /* A disabled button must LOOK disabled — the bind-* demo is about an attribute you
         otherwise cannot see, and an unstyled :disabled looks exactly like an enabled one. */
      button:disabled { opacity: 0.4; cursor: not-allowed; border-style: dashed; }
      /* And a field must not look like a button. They shared a border, a radius and a padding,
         so the bound <input> in the bind-* demo read as a fourth button. */
      input, select {
        border-color: color-mix(in srgb, var(--accent) 30%, var(--paper));
        background: color-mix(in srgb, var(--soft) 35%, var(--paper));
        border-radius: 0.25rem;
      }
      input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      /* A range or a checkbox is not a text field: the shared border and padding inset the track,
         so the thumb at max stopped short of the end and 100 did not look like 100. */
      input[type="range"], input[type="checkbox"], input[type="radio"] {
        border: 0; background: none; padding: 0; vertical-align: middle;
      }
      /* The attribute mirror: what the DOM actually holds, beside the thing holding it. */
      .mirror { font: 0.85rem/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--soft); border-radius: 0.4rem; padding: 0.4rem 0.7rem; margin: 0.4rem 0 0; }
      .mirror b { font-weight: 600; }
      .mirror .absent { opacity: 0.55; font-style: italic; }
      .pill { display: inline-block; padding: 0.1rem 0.6rem; border-radius: 1rem; background: var(--soft); }
      .is-open { outline: 2px solid var(--good); }
      .bulk { color: var(--bad); font-weight: 700; }
      .card {
        border: 1px solid var(--soft); border-radius: 0.7rem; padding: 0.9rem; margin: 0.4rem 0;
        background: color-mix(in srgb, var(--soft) 30%, var(--paper));
      }
      .tall-space { height: 45vh; display: grid; place-items: center; opacity: 0.45; font-size: 0.9rem; }
      .stage { border: 1px dashed var(--soft); border-radius: 0.7rem; padding: 1rem; }
      .hero-box {
        width: 7rem; height: 7rem; border-radius: 1rem; background: var(--accent);
        display: grid; place-items: center; color: #fff; font-weight: 700;
      }
      .gallery {
        display: flex; gap: 1rem; overflow-x: auto; padding: 1rem; scroll-snap-type: x mandatory;
        border: 1px dashed var(--soft); border-radius: 0.7rem;
      }
      .gallery .hero-box { flex: 0 0 12rem; height: 9rem; scroll-snap-align: center; }
      .poem { font-size: 1.35rem; max-width: 34rem; }
      .rejections { font-size: 0.85rem; }
      .rejections li { margin: 0.3rem 0; }
      .rejections code { background: var(--soft); padding: 0 0.3rem; border-radius: 0.3rem; }
      table.vocab { border-collapse: collapse; font-size: 0.85rem; }
      table.vocab td, table.vocab th { border: 1px solid var(--soft); padding: 0.3rem 0.6rem; text-align: left; }
      .modal {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: color-mix(in srgb, var(--ink) 40%, transparent); z-index: 20;
      }
      /* The dialog panel had no layout at all — children stacked at whatever width they defaulted
         to, so two inputs and a button came out three different sizes with no spacing. */
      .modal > div {
        background: var(--paper); border-radius: 1rem; padding: 1.5rem; max-width: 22rem; filter: none;
        display: grid; gap: 0.6rem; box-shadow: 0 1rem 3rem color-mix(in srgb, var(--ink) 30%, transparent);
      }
      .modal > div h3 { margin: 0; }
      .modal > div button { justify-self: start; }
      .konami-row span { font-size: 1.6rem; opacity: 0.25; transition: opacity 0.2s, transform 0.2s; }
      .konami-row span.hit { opacity: 1; transform: translateY(-4px); }
      /* A gradient bigger than its frame, moved by scroll: the shift is continuous because a
         transform interpolates, where paint's colour table is deliberately discrete. */
      .sky { position: relative; height: 190px; border-radius: 0.75rem; overflow: hidden; }
      .sky-layer {
        position: absolute; inset: -60% -20%;
        background: conic-gradient(from 0deg, #6246ea, #ff8e6e, #ffd97d, #57cc99, #4cc9f0, #6246ea);
        filter: blur(18px) saturate(1.2);
      }
      .sky-label { position: absolute; inset: 0; display: grid; place-items: center;
        font-weight: 700; color: var(--paper); text-shadow: 0 1px 6px rgb(0 0 0 / 0.45); }
      /* The dot chases the pointer: the directive writes a TARGET, the transition does the
         lagging. Nothing animates the dot frame by frame — the compositor carries it. */
      .pad { position: relative; height: 260px; border-radius: 0.75rem; overflow: hidden;
        background: color-mix(in srgb, var(--soft) 60%, var(--paper)); cursor: crosshair; }
      .pad .hint { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0.5; }
      .dot {
        position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%;
        background: var(--accent); pointer-events: none;
        left: calc(var(--x, 0.5) * 100%); top: calc(var(--y, 0.5) * 100%);
        transition: left 420ms cubic-bezier(0.22, 1, 0.36, 1),
                    top 420ms cubic-bezier(0.22, 1, 0.36, 1),
                    opacity 200ms, transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .dot.trailer { width: 54px; height: 54px; margin: -27px 0 0 -27px; opacity: 0.28;
        transition-duration: 900ms, 900ms, 200ms, 900ms; }
      .lag-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; align-items: start; }
      /* Four ACROSS, not four stacked: stacked, the row was taller than the viewport, so its own
         midpoint only arrived when it was nearly gone and you could never see two modes at once. */
      .reveal-row { display: grid; gap: 0.8rem; grid-template-columns: repeat(4, 1fr); }
      .reveal-row .hero-box { margin: 0; min-height: 8rem; font-size: 0.95rem; }
      @media (max-width: 720px) { .reveal-row { grid-template-columns: repeat(2, 1fr); } }
      /**
       * The rider follows a CSS `offset-path`, whose coordinates are PIXELS in the element's own
       * containing block — while the curve is drawn in the SVG's viewBox units. With `width: 100%`
       * and a fixed height the SVG scaled non-uniformly, so the two spaces disagreed and the ball
       * traced the right shape in the wrong place. Rendering the SVG at its intrinsic 600×130 makes
       * one unit one pixel, and the wrapper gives the absolutely-positioned rider the same origin.
       */
      .trail-wrap { position: relative; width: 600px; max-width: 100%; height: 130px; margin-inline: auto; }
      svg.trail { display: block; width: 600px; height: 130px; }
      .rider {
        position: absolute; top: 0; left: 0;
        width: 2rem; height: 2rem; border-radius: 50%; background: var(--accent); offset-rotate: 0deg;
      }
    </style>
  </head>
  <body>
    <app-shell></app-shell>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
