<h3 style="margin-top:0">The live-handler panel</h3>
<div data-vd-state="{ n: 0 }">
  <button data-vd-on-click="{ n: n + 1 }">clicked <b data-vd-text="n">0</b> times</button>
</div>
<p>This button did not exist when the page loaded and nothing hydrated it — directives match by
attribute at dispatch, so swapped markup is live from its first event.</p>
