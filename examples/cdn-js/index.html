<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VeraJS — buildless</title>

    <!--
      No build step. No bundler. No transpiler.

      This importmap points at the bundles in this repo, which exist after `npm run build`.
      To run the exact same source on CodePen, swap these for CDN URLs and change nothing else:

        "@verajs/core":        "https://cdn.jsdelivr.net/npm/@verajs/core/dist/vera.min.js"
        "@verajs/router":      "https://cdn.jsdelivr.net/npm/@verajs/router/dist/vera-router.min.js"
        "@verajs/autoloader":  "https://cdn.jsdelivr.net/npm/@verajs/autoloader/dist/vera-autoloader.min.js"
        "@verajs/renderer":    "https://cdn.jsdelivr.net/npm/@verajs/renderer/dist/vera-renderer.min.js"

      Four bundles and nothing else — no third-party renderer, and no network dependency this
      project does not publish. That is the point of the mode.
    -->
    <!--
      This example is served from a subdirectory, so it declares where it is mounted. The router
      reads this element: routes stay written at the root (`/hello`), the base is added to the
      address bar and stripped back off when one is read. Relative hrefs below resolve against it
      too, which is the platform doing the same job for links.

      A site at the origin root needs none of this. `setBasePath('/somewhere')` is the alternative
      for an app that does not want `<base>` rebasing its assets as well.
    -->
    <base href="/examples/cdn-js/" />

    <script type="importmap">
      {
        "imports": {
          "@verajs/core": "/packages/core/dist/vera.min.js",
          "@verajs/router": "/packages/router/dist/vera-router.min.js",
          "@verajs/autoloader": "/packages/autoloader/dist/vera-autoloader.min.js",
          "@verajs/renderer": "/packages/renderer/dist/vera-renderer.min.js"
        }
      }
    </script>

    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 46rem;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      nav a {
        margin-right: 0.75rem;
      }
      [view='main'] {
        min-height: 4rem;
        padding: 0.75rem;
        border: 1px dashed currentColor;
        border-radius: 0.375rem;
      }
    </style>
  </head>
  <body>
    <h1>VeraJS — buildless</h1>
    <p>
      Everything on this page runs directly in the browser: native ES modules, an importmap, and
      tagged template literals. Nothing was compiled. Compare with
      <a href="/examples/npm-ts/">the npm + TypeScript example</a>.
    </p>

    <demo-app autoloader></demo-app>

    <script type="module" src="./src/index.js"></script>
  </body>
</html>
