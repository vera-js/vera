name: Release
on:
  push:
    branches: [master]
concurrency: release-${{ github.ref }}

# Releases are cut locally: `npx changeset version` bumps versions and writes
# CHANGELOGs, you review the diff, commit and push. This workflow publishes
# whatever is on master and not yet on npm. `changeset publish` skips anything
# already published, so an ordinary push is a green no-op.
#
# Deliberately no Version PR. See internal/docs/RELEASE-DESIGN.md for the full
# reasoning and for how to move to a PR-based flow if this repo ever gets more
# than one maintainer.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Read-only on the repo. Tags are created locally when the release is cut
      # (scripts/tag-release.mjs), so this workflow never needs write access.
      contents: read
      # Trusted Publishing: npm verifies this workflow's OIDC identity.
      # The trust binding names vera-js/vera + release.yml, so this file's
      # NAME is load-bearing. Renaming it breaks publishing for all packages.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build

      - name: Note any changesets awaiting a release
        run: |
          pending=$(ls .changeset/*.md 2>/dev/null | grep -cv 'README' || true)
          if [ "${pending:-0}" -gt 0 ]; then
            echo "::notice::${pending} changeset(s) on master have not been versioned. Nothing will publish until 'npx changeset version' is run and pushed."
          fi

      - name: Publish to npm
        run: npx changeset publish
        env:
          # Provenance is documented as automatic under OIDC but has been
          # reported inconsistent. Asking explicitly is free. package.json
          # repository.url must match this repo or the registry returns 422.
          NPM_CONFIG_PROVENANCE: true
