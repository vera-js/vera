name: Release
on:
  push:
    branches: [master]
concurrency: release-${{ github.ref }}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Trusted Publishing: npm verifies this workflow's OIDC identity. No NPM_TOKEN anywhere.
      # The trust binding names vera-js/vera + release.yml, so this file's NAME is load-bearing.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - name: Version PR, or publish on merge
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Provenance is documented as automatic under OIDC but has been reported inconsistent.
          # Asking explicitly is free; package.json repository.url must match this repo or the
          # registry rejects the publish with 422.
          NPM_CONFIG_PROVENANCE: true
