name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard - private material must never be committed here
        run: |
          leaked=$(git ls-files | grep -E '^(internal/|archive/|docs/(VIABILITY|TODO|PUBLISHING)\.md|docs/audits/)' || true)
          if [ -n "$leaked" ]; then
            echo "::error::Private paths committed to the public repo:"
            echo "$leaked"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/sync-packages.mjs
      # Clean as of this commit, so it can stay clean. It was previously linting dist/ and the
      # private internal/ clone, which buried the real findings under ~2 200 generated-code errors.
      # The build transpiles TypeScript but does not fail on type errors, so without this the
      # type layer gates nothing — a real error sat in hydrate.ts until the 2026-08-22 audit.
      - run: npm run typecheck
      - run: npx eslint .
      - run: npm run build
      # Published size claims are generated from the build. This fails if any of them has drifted,
      # or if bench/size-snapshot.json no longer describes the current dist. The competing
      # frameworks are NOT needed here: per-module sizes come from dist, and the cross-framework
      # table is verified for staleness rather than regenerated.
      # A version bumped on master without its tag means the release was cut wrong. Verification
      # only — this never writes, and it tolerates a dirty tree so it is safe in CI.
      - run: node scripts/tag-release.mjs --check
      - run: node scripts/sync-size-claims.mjs --check
      # Twice, against different programs. dist/development keeps workspace deps external and
      # keeps __DEV__ code; dist/*.min.js mangles properties, drops console.log, eliminates dead
      # branches and inlines workspace deps. A pass against one says nothing about the other.
      - run: npm test
      - run: npm run test:prod
      # The browser-truth layer. jsdom has no adoptedStyleSheets, no CSSScopeRule, does not parse
      # declarative shadow DOM and runs no layout engine — so @verajs/styles and hydration had
      # never executed their real paths anywhere. These suites are the only place they do.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
